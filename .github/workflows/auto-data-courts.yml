name: Auto Data · Courts

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r backend/scripts/requirements.txt

      - name: Restore cursor
        uses: actions/cache@v4
        with:
          path: .cursor/courts.json
          key: cursor-courts-${{ github.run_number }}
          restore-keys: cursor-courts-

      - name: Run CourtListener collector
        run: python backend/scripts/courts/courtlistener.py
        env:
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}

      - name: Run SCOTUSblog RSS collector
        run: python backend/scripts/courts/scotusblog.py
        env:
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}

      - name: Save cursor
        uses: actions/cache@v4
        with:
          path: .cursor/courts.json
          key: cursor-courts-${{ github.run_number }}
