name: Auto Data · Bills · Maryland

on:
  schedule:
    - cron: '39 2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r backend/scripts/requirements.txt

      - name: Restore cursor
        uses: actions/cache@v4
        with:
          path: .cursor/md.json
          key: cursor-md-${{ github.run_number }}
          restore-keys: cursor-md-

      - name: Run Maryland collector
        run: python backend/scripts/bills/md.py
        env:
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}

      - name: Save cursor
        uses: actions/cache@v4
        with:
          path: .cursor/md.json
          key: cursor-md-${{ github.run_number }}
