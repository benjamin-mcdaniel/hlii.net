name: Auto Data · Bills · New York

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r backend/scripts/requirements.txt

      - name: Restore cursor
        uses: actions/cache@v4
        with:
          path: .cursor/ny.json
          key: cursor-ny-${{ github.run_number }}
          restore-keys: cursor-ny-

      - name: Run New York collector
        run: python backend/scripts/bills/ny.py
        env:
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}
          NY_OPENLEG_KEY: ${{ secrets.NY_OPENLEG_KEY }}

      - name: Save cursor
        uses: actions/cache@v4
        with:
          path: .cursor/ny.json
          key: cursor-ny-${{ github.run_number }}
