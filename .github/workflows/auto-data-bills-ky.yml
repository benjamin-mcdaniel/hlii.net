name: Auto Data · Bills · Kentucky

on:
  schedule:
    - cron: '33 2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r backend/scripts/requirements.txt

      - name: Restore cursor
        uses: actions/cache@v4
        with:
          path: .cursor/ky.json
          key: cursor-ky-${{ github.run_number }}
          restore-keys: cursor-ky-

      - name: Run Kentucky collector
        run: python backend/scripts/bills/ky.py
        env:
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}

      - name: Save cursor
        uses: actions/cache@v4
        with:
          path: .cursor/ky.json
          key: cursor-ky-${{ github.run_number }}
