name: Auto Data · Keywords

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r backend/scripts/requirements.txt

      - name: Run Haiku classification
        run: python backend/scripts/core/classify.py
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}
