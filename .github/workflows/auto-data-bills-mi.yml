name: Auto Data · Bills · Michigan

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r backend/scripts/requirements.txt

      - name: Restore cursor
        uses: actions/cache@v4
        with:
          path: .cursor/mi.json
          key: cursor-mi-${{ github.run_number }}
          restore-keys: cursor-mi-

      - name: Run Michigan collector
        run: python backend/scripts/bills/mi.py
        env:
          HLII_INGEST_TOKEN: ${{ secrets.HLII_INGEST_TOKEN }}

      - name: Save cursor
        uses: actions/cache@v4
        with:
          path: .cursor/mi.json
          key: cursor-mi-${{ github.run_number }}
