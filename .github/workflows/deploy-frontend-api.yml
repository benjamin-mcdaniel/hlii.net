name: Deploy Frontend API

# Deploys the user-interface API worker at frontend/api to Cloudflare.
# Static site (frontend/web) is auto-deployed by Cloudflare Pages and is
# intentionally not handled here.

on:
  push:
    branches: [main]
    paths:
      - "frontend/api/**"
      - ".github/workflows/deploy-frontend-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/api/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          # CLOUDFLARE_API_TOKEN must have Workers Scripts:Edit and read access
          # to the hlii.net zone. It also covers databases / storage for the
          # backend worker.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
